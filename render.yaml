# Render Blueprint Specification for AlumniVerse
services:
  # 1. C++ Crow Backend Web Service (Free Tier)
  - type: web
    name: alumniverse-backend-cpp
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend Static Site (100% Free)
  - type: static_site
    name: alumniverse-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    root: frontend
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://alumniverse-backend-cpp.onrender.com/api/v1
